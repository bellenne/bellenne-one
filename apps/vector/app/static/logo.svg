<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48" role="img" aria-labelledby="title desc">
  <title id="title">BellenneVector</title>
  <desc id="desc">Фирменный знак BellenneVector с восходящей стрелкой</desc>
  <defs>
    <style>
      .vector-path { transform-box: fill-box; transform-origin: center; animation: vector-lift 3s ease-in-out infinite; }
      .vector-travel { stroke-dasharray: .15 .85; animation: vector-travel 3s linear infinite; filter: drop-shadow(0 0 4px #2563EB); }
      .vector-tip { transform-box: fill-box; transform-origin: center; animation: vector-tip 3s ease-in-out infinite; }
      @keyframes vector-lift { 0%, 35%, 65%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
      @keyframes vector-travel { to { stroke-dashoffset: -1; } }
      @keyframes vector-tip { 0%, 35%, 65%, 100% { opacity: .72; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
      @media (prefers-reduced-motion: reduce) { .vector-path, .vector-travel, .vector-tip { animation: none; } }
    </style>
  </defs>
  <g class="vector-path" fill="none" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 37 19 24l10 8 23-22" stroke-width="2" opacity=".46"/>
    <path class="vector-travel" pathLength="1" d="M5 37 19 24l10 8 23-22" stroke-width="3"/>
    <path class="vector-tip" d="M40 10h12v12" stroke-width="3"/>
  </g>
  <circle cx="5" cy="37" r="2" fill="#2563EB"/>
  <text x="66" y="31" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Bellenne</text>
  <text x="159" y="31" fill="#2563EB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Vector</text>
</svg>
