<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48" role="img" aria-labelledby="title desc">
  <title id="title">BellenneEcho</title>
  <desc id="desc">Фирменный знак BellenneEcho со звуковой волной</desc>
  <defs>
    <style>
      .echo-wave { transform-box: fill-box; transform-origin: center; animation: echo-breathe 3.2s ease-in-out infinite; }
      .echo-travel { stroke-dasharray: .16 .84; animation: echo-travel 3.2s linear infinite; filter: drop-shadow(0 0 4px #06B6D4); }
      .echo-node { transform-box: fill-box; transform-origin: center; animation: echo-node 3.2s ease-in-out infinite; }
      @keyframes echo-breathe { 0%, 30%, 70%, 100% { transform: scaleY(.88); } 50% { transform: scaleY(1); } }
      @keyframes echo-travel { to { stroke-dashoffset: -1; } }
      @keyframes echo-node { 0%, 35%, 65%, 100% { opacity: .65; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
      @media (prefers-reduced-motion: reduce) { .echo-wave, .echo-travel, .echo-node { animation: none; } }
    </style>
  </defs>
  <g class="echo-wave" fill="none" stroke="#06B6D4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 24h6c3 0 3-8 6-8s3 16 6 16 3-24 6-24 3 32 6 32 3-24 6-24 3 16 6 16 3-8 6-8h6" stroke-width="2" opacity=".46"/>
    <path class="echo-travel" pathLength="1" d="M4 24h6c3 0 3-8 6-8s3 16 6 16 3-24 6-24 3 32 6 32 3-24 6-24 3 16 6 16 3-8 6-8h6" stroke-width="3"/>
  </g>
  <circle class="echo-node" cx="4" cy="24" r="2" fill="#06B6D4"/>
  <circle class="echo-node" cx="58" cy="24" r="2" fill="#06B6D4"/>
  <text x="68" y="31" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Bellenne</text>
  <text x="161" y="31" fill="#06B6D4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Echo</text>
</svg>
