<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48" role="img" aria-labelledby="title desc">
  <title id="title">BellennePulse</title>
  <desc id="desc">Фирменный знак BellennePulse: поток данных и текстовый wordmark</desc>
  <defs>
    <linearGradient id="bp-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B3CFF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <style>
      .bp-signal { transform-box: fill-box; transform-origin: center; animation: bp-beat 2.8s ease-in-out infinite; }
      .bp-signal-travel { stroke-dasharray: .14 .86; animation: bp-travel 2.8s linear infinite; filter: drop-shadow(0 0 4px #7B3CFF); }
      @keyframes bp-beat { 0%, 36%, 52%, 100% { transform: scaleY(1); } 42% { transform: scaleY(1.10); } 47% { transform: scaleY(.96); } }
      @keyframes bp-travel { to { stroke-dashoffset: -1; } }
      @media (prefers-reduced-motion: reduce) { .bp-signal, .bp-signal-travel { animation: none; } }
    </style>
  </defs>
  <path class="bp-signal" d="M4 25h8l4-7 6 14 6-23 7 31 6-19 5 4h8" fill="none" stroke="url(#bp-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="bp-signal-travel" pathLength="1" d="M4 25h8l4-7 6 14 6-23 7 31 6-19 5 4h8" fill="none" stroke="url(#bp-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="4" cy="25" r="2" fill="#7B3CFF"/>
  <circle cx="54" cy="25" r="2" fill="#2563EB"/>
  <text x="64" y="31" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Bellenne</text>
  <text x="157" y="31" fill="url(#bp-gradient)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Pulse</text>
</svg>
