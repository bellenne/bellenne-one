{% macro icon(name, size=20) -%}
<svg class="ui-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
  {% elif name == 'jobs' %}<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>
  {% elif name == 'queue' %}<path d="M5 6h14M5 12h14M5 18h14"/><circle cx="3" cy="6" r=".5"/><circle cx="3" cy="12" r=".5"/><circle cx="3" cy="18" r=".5"/>
  {% elif name == 'workers' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h2M15 9h2M15 13h2"/>
  {% elif name == 'results' %}<path d="M4 4h16v16H4z"/><path d="m7 16 3-3 2 2 3-4 2 5"/><circle cx="9" cy="9" r="1"/>
  {% elif name == 'presets' %}<path d="M4 7h16M4 17h16M8 4v6M16 14v6"/>
  {% elif name == 'integrations' %}<path d="M8 12h8M6 8l-4 4 4 4M18 8l4 4-4 4"/>
  {% elif name == 'logs' %}<path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/>
  {% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  {% elif name == 'logout' %}<path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/>
  {% elif name == 'chevron' %}<path d="m8 10 4 4 4-4"/>
  {% elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>
  {% elif name == 'pulse' %}<path d="M3 12h4l2-4 3 8 3-12 3 8h3"/>

  {% elif name == 'proof' %}<path d="M4 6h6l2 3h8v9H4z"/><path d="M8 13h8M8 16h5"/>
  {% elif name == 'settings' %}<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/>

  {% endif %}
</svg>
{%- endmacro %}
