{% macro processing_badge(status, labels) -%}<span class="badge {% if status == 'completed' %}badge-positive{% elif status == 'failed' %}badge-negative{% elif status == 'retrying' %}badge-warning{% elif status in ('assigned', 'running') %}badge-product{% else %}badge-neutral{% endif %}">{{ labels.get(status, status) }}</span>{%- endmacro %}
{% macro delivery_badge(status, labels) -%}<span class="badge {% if status == 'delivered' %}badge-positive{% elif status == 'failed' %}badge-negative{% elif status == 'retrying' %}badge-warning{% elif status == 'delivering' %}badge-product{% else %}badge-neutral{% endif %}">{{ labels.get(status, status) }}</span>{%- endmacro %}
