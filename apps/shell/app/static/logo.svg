<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48" role="img" aria-labelledby="title desc">
  <title id="title">BellenneOne</title>
  <desc id="desc">Фирменный знак BellenneOne: три продуктовых потока сходятся в одной точке</desc>
  <defs>
    <linearGradient id="one-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B3CFF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <style>
      .one-stream { stroke-dasharray: .13 .87; animation: one-flow 3.4s linear infinite; filter: drop-shadow(0 0 4px #7B3CFF); }
      .one-stream-two { animation-delay: -1.1s; }
      .one-stream-three { animation-delay: -2.2s; }
      .one-core { transform-box: fill-box; transform-origin: center; animation: one-core 3.4s ease-in-out infinite; }
      @keyframes one-flow { to { stroke-dashoffset: -1; } }
      @keyframes one-core { 0%, 34%, 66%, 100% { opacity: .72; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { .one-stream, .one-core { animation: none; } }
    </style>
  </defs>
  <g fill="none" stroke="url(#one-gradient)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11 24 24 54 24" stroke-width="2" opacity=".36"/>
    <path d="M4 24h50" stroke-width="2" opacity=".36"/>
    <path d="M4 37 24 24 54 24" stroke-width="2" opacity=".36"/>
    <path class="one-stream one-stream-one" pathLength="1" d="M4 11 24 24 54 24" stroke-width="3"/>
    <path class="one-stream one-stream-two" pathLength="1" d="M4 24h50" stroke-width="3"/>
    <path class="one-stream one-stream-three" pathLength="1" d="M4 37 24 24 54 24" stroke-width="3"/>
  </g>
  <circle class="one-core" cx="54" cy="24" r="3" fill="#2563EB"/>
  <text x="66" y="31" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Bellenne</text>
  <text x="159" y="31" fill="url(#one-gradient)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">One</text>
</svg>
