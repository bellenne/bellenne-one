events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  upstream pulse_upstream {
    server pulse:17863;
  }

  upstream shell_upstream {
    server shell:8000;
  }

  upstream echo_upstream {
    server echo:8000;
  }

  upstream vector_upstream {
    server vector:8000;
  }

  server {
    listen 80;
    absolute_redirect off;
    client_max_body_size 32m;

    location = /gateway-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /_bellenne_auth {
      internal;
      proxy_pass http://pulse_upstream/internal/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Host $http_host;
    }

    location @platform_login {
      return 303 /login;
    }

    location = /login {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream;
      proxy_redirect off;
    }

    location = /register {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream;
      proxy_redirect off;
    }

    location = /logout {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream;
      proxy_redirect off;
    }

    location = /pulse {
      return 308 /pulse/;
    }

    location /pulse/static/ {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream/static/;
      proxy_redirect off;
    }

    location /pulse/ {
      auth_request /_bellenne_auth;
      error_page 401 = @platform_login;

      proxy_set_header X-Forwarded-Prefix /pulse;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream/;
      proxy_redirect ~^(/accounts.*)$ /pulse$1;
      proxy_redirect ~^(/plans.*)$ /pulse$1;
      proxy_redirect ~^(/reports.*)$ /pulse$1;
    }

    location = /echo {
      return 308 /echo/;
    }

    location /echo/ {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Prefix /echo;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://echo_upstream/;
      proxy_redirect off;
    }

    location = /vector {
      return 308 /vector/;
    }

    location /vector/ {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Prefix /vector;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://vector_upstream/;
      proxy_redirect off;
    }

    location / {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://shell_upstream;
      proxy_redirect off;
    }
  }
}
