events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream pulse_upstream {
    zone pulse_upstream 64k;
    server pulse:17863 resolve;
  }

  upstream shell_upstream {
    zone shell_upstream 64k;
    server shell:8000 resolve;
  }

  upstream echo_upstream {
    zone echo_upstream 64k;
    server echo:8000 resolve;
  }

  upstream vector_upstream {
    zone vector_upstream 64k;
    server vector:8000 resolve;
  }

  upstream nest_upstream {
    zone nest_upstream 64k;
    server nest:8000 resolve;
  }

  upstream proof_upstream {
    zone proof_upstream 64k;
    server proof:8000 resolve;
  }

  server {
    listen 80;
    absolute_redirect off;
    client_max_body_size 32m;

    location = /gateway-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /_bellenne_auth {
      internal;
      proxy_pass http://pulse_upstream/internal/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Host $http_host;
    }

    location @platform_login {
      return 303 /login;
    }

    location = /login {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream;
      proxy_redirect off;
    }

    location = /register {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream;
      proxy_redirect off;
    }

    location = /logout {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream;
      proxy_redirect off;
    }

    location = /pulse {
      return 308 /pulse/;
    }

    location /pulse/static/ {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream/static/;
      proxy_redirect off;
    }

    location /pulse/ {
      auth_request /_bellenne_auth;
      error_page 401 = @platform_login;

      proxy_set_header X-Forwarded-Prefix /pulse;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://pulse_upstream/;
      proxy_redirect ~^(/accounts.*)$ /pulse$1;
      proxy_redirect ~^(/plans.*)$ /pulse$1;
      proxy_redirect ~^(/reports.*)$ /pulse$1;
    }

    location = /echo {
      return 308 /echo/;
    }

    location /echo/ {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Prefix /echo;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://echo_upstream/;
      proxy_redirect off;
    }

    location = /vector {
      return 308 /vector/;
    }

    location /vector/ {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Prefix /vector;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://vector_upstream/;
      proxy_redirect off;
    }

    location = /nest {
      return 308 /nest/;
    }

    location /nest/api/ {
      proxy_set_header X-Forwarded-Prefix /nest;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://nest_upstream/api/;
      proxy_redirect off;
    }

    location = /nest/calculate {
      proxy_set_header X-Forwarded-Prefix /nest;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://nest_upstream/calculate;
      proxy_redirect off;
    }

    location = /nest/settings/defaults {
      proxy_set_header X-Forwarded-Prefix /nest;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://nest_upstream/settings/defaults;
      proxy_redirect off;
    }

    location /nest/ {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Prefix /nest;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://nest_upstream/;
      proxy_redirect off;
    }

    location = /proof {
      return 308 /proof/;
    }

    location /proof/api/v1/ {
      client_max_body_size 128m;
      proxy_set_header X-Forwarded-Prefix /proof;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Proof-Worker-Token $http_x_proof_worker_token;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_pass http://proof_upstream/api/v1/;
      proxy_redirect off;
    }

    location /proof/webhooks/amocrm/ {
      proxy_set_header X-Forwarded-Prefix /proof;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://proof_upstream/webhooks/amocrm/;
      proxy_redirect off;
    }

    location = /proof/integrations/amocrm/oauth/callback {
      proxy_set_header X-Forwarded-Prefix /proof;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://proof_upstream/integrations/amocrm/oauth/callback;
      proxy_redirect off;
    }

    location = /proof/integrations/amocrm/oauth/revoked {
      proxy_set_header X-Forwarded-Prefix /proof;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://proof_upstream/integrations/amocrm/oauth/revoked;
      proxy_redirect off;
    }

    location /proof/ {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Prefix /proof;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://proof_upstream/;
      proxy_redirect off;
    }

    location / {
      auth_request /_bellenne_auth;
      auth_request_set $bellenne_user_id $upstream_http_x_bellenne_user_id;
      auth_request_set $bellenne_username $upstream_http_x_bellenne_username;
      auth_request_set $bellenne_csrf $upstream_http_x_bellenne_csrf_token;
      error_page 401 = @platform_login;

      proxy_set_header X-Bellenne-User-Id $bellenne_user_id;
      proxy_set_header X-Bellenne-Username $bellenne_username;
      proxy_set_header X-Bellenne-Csrf-Token $bellenne_csrf;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_pass http://shell_upstream;
      proxy_redirect off;
    }
  }
}
